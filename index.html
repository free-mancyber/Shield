<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shield</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,button,select{-webkit-user-select:text;user-select:text}

:root{
    --bg: #08080f;
    --bg2: #12121f;
    --bg3: #0d0d18;
    --border: #2a2a40;
    --text: #f0f0ff;
    --text2: #8888aa;
    --accent1: #7c5cfc;
    --accent2: #5c3dcc;
    --accent3: #4a2fa8;
    --shadow: rgba(124,92,252,0.2);
    --card-bg: rgba(18,18,31,0.92);
    --input-bg: rgba(8,8,15,0.95);
    --hover: rgba(124,92,252,0.12);
    --glass: rgba(255,255,255,0.05);
    --radius: 20px;
    --radius-sm: 12px;
}

.light{
    --bg: #eef2f9;
    --bg2: #ffffff;
    --bg3: #f4f6fc;
    --border: #cbd5e1;
    --text: #0f172a;
    --text2: #475569;
    --accent1: #6366f1;
    --accent2: #4f46e5;
    --accent3: #4338ca;
    --shadow: rgba(99, 102, 241, 0.15);
    --card-bg: #ffffff;
    --input-bg: #f8fafc;
    --hover: rgba(99, 102, 241, 0.08);
    --glass: rgba(255, 255, 255, 0.95);
}

.light #app-bg {
    background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 60%, #94a3b8 100%) !important;
}

.light .nav {
    background: rgba(255, 255, 255, 0.98) !important;
    border-color: rgba(99, 102, 241, 0.3) !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
}

.light .nav button {
    color: #475569 !important;
}

.light .nav button.active {
    color: #ffffff !important;
}

.light input, .light select, .light textarea {
    color: #0f172a !important;
    background: #ffffff !important;
    border-color: #cbd5e1 !important;
}

.light .secondary {
    background: #ffffff !important;
    color: #0f172a !important;
    border-color: #cbd5e1 !important;
}

.light .item, .light .setting, .light .card, .light .media-card {
    background: #ffffff !important;
    border-color: #cbd5e1 !important;
    color: #0f172a !important;
}

.light .modal-box {
    background: #ffffff !important;
    border-color: #cbd5e1 !important;
    color: #0f172a !important;
}

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{position:relative;}

#app-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1a0f38 0%, #0d0a1d 60%, #05040a 100%);
    transform: translateZ(0);
}

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}
.particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(200,160,255,0.8);
    box-shadow: 0 0 8px rgba(124,92,252,0.6);
    animation: float linear infinite;
    will-change: transform, opacity;
}
@keyframes float {
    0% { transform: translate3d(0, 105vh, 0) scale(0.5); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.8; }
    100% { transform: translate3d(0, -10vh, 0) scale(1); opacity: 0; }
}

#root {
    position: relative;
    z-index: 1;
}

button, input, select, textarea, .card, .item, .setting, .media-card, .lock-box, .nav, .modal-box {
    transition: background 0.15s linear, border-color 0.15s linear, color 0.15s linear, transform 0.15s ease-out;
}

button, input { font: inherit; }
button { cursor: pointer; position: relative; overflow: hidden; }

@keyframes fadeIn{from{opacity:0;transform:translate3d(0, 8px, 0)}to{opacity:1;transform:translate3d(0, 0, 0)}}
@keyframes slideUp{from{opacity:0;transform:translate3d(0, 15px, 0)}to{opacity:1;transform:translate3d(0, 0, 0)}}
@keyframes toastIn{from{opacity:0;transform:translate3d(-50%, 15px, 0) scale(0.95)}to{opacity:1;transform:translate3d(-50%, 0, 0) scale(1)}}
@keyframes modalIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}

#content{display:block;min-height:220px;will-change:opacity}

.primary{width:100%;margin-top:18px;padding:16px;border:0;border-radius:var(--radius);color:#fff;font-weight:600;font-size:16px;background:linear-gradient(135deg,var(--accent1),var(--accent2));position:relative;overflow:hidden}
.primary:hover{transform:translate3d(0, -2px, 0);box-shadow:0 8px 25px var(--shadow)}
.primary:active{transform:translate3d(0, 0, 0) scale(0.98)}
.primary:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

.small{padding:10px 16px;border:0;border-radius:var(--radius-sm);color:#fff;font-weight:600;background:linear-gradient(135deg,var(--accent1),var(--accent2))}
.small:hover{transform:translate3d(0, -2px, 0);box-shadow:0 6px 20px var(--shadow)}
.small:active{transform:scale(0.95)}

.secondary{padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-weight:500}
.secondary:hover{background:var(--hover);border-color:var(--accent1);transform:translate3d(0, -2px, 0)}
.secondary:active{transform:scale(0.95)}

.danger-btn{padding:10px 16px;border:0;border-radius:var(--radius-sm);background:rgba(255,80,80,0.15);color:#ff6b6b;font-weight:500}
.danger-btn:hover{background:rgba(255,80,80,0.25);transform:translate3d(0, -2px, 0)}
.danger-btn:active{transform:scale(0.95)}

.success-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;padding:10px 16px;border:0;border-radius:var(--radius-sm);font-weight:600}
.success-btn:hover{transform:translate3d(0, -2px, 0)}
.success-btn:active{transform:scale(0.95)}

.icon-button{width:44px;height:44px;border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:var(--radius-sm);font-size:20px;display:flex;align-items:center;justify-content:center}
.icon-button:hover{background:var(--hover);border-color:var(--accent1);transform:scale(1.05)}
.icon-button:active{transform:scale(0.92)}

.toggle-btn{padding:7px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500}
.toggle-btn.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:var(--accent1);color:#fff;box-shadow:0 4px 15px var(--shadow)}
.toggle-btn:hover{border-color:var(--accent1)}

.card{padding:20px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius)}
.card:hover{border-color:var(--accent1);transform:translate3d(0, -3px, 0)}

.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius)}
.item:hover{border-color:var(--accent1);transform:translate3d(2px, 0, 0)}

.setting{padding:16px 18px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.setting-label{font-weight:600;font-size:15px}
.setting-desc{color:var(--text2);font-size:13px;margin-top:2px}

.media-card{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg)}
.media-card:hover{border-color:var(--accent1);transform:translate3d(0, -3px, 0)}

.avatar-section{display:flex;align-items:center;gap:18px;padding:12px 0}
.avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,var(--accent1),var(--accent2));border:3px solid var(--border);flex-shrink:0;cursor:pointer;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

.avatar-emoji-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.avatar-emoji-list button{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);background:var(--bg2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.avatar-emoji-list button.active{border-color:var(--accent1);background:linear-gradient(135deg,var(--accent1),var(--accent2))}

.modal{position:fixed;z-index:500;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.8);animation:fadeIn 0.15s ease}
.modal-box{width:100%;max-width:540px;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);animation:modalIn 0.2s ease;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{margin:0;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-close{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;background:var(--bg);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.toast{position:fixed;z-index:1000;left:50%;bottom:100px;transform:translate3d(-50%, 0, 0);padding:12px 20px;color:#fff;border-radius:var(--radius-sm);font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.4);animation:toastIn 0.25s ease;max-width:90%;text-align:center}
.toast.success{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.toast.error{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}
.toast.warning{background:linear-gradient(135deg,#f1c40f,#f39c12);color:#1a1a2e}

.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;}
.lock-box{width:100%;max-width:440px;padding:36px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg);box-shadow:0 25px 70px rgba(0,0,0,0.5);animation:slideUp 0.3s ease;text-align:center}

.logo {
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    background: transparent;
    margin: 0 auto 16px auto;
    position: relative;
}
.gold-shield-svg {
    width: 80px;
    height: 80px;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.35));
}

h1{margin-top:0;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.muted{color:var(--text2);font-size:14px;text-align:center}
.field{margin-top:16px;text-align:left}
.field label{display:block;color:var(--text2);font-size:13px;margin-bottom:6px;font-weight:500}
input{width:100%;padding:14px 16px;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;font-size:15px}
input:focus{border-color:var(--accent1);box-shadow:0 0 0 3px rgba(124,92,252,0.2)}
.security{margin-top:20px;color:var(--text2);font-size:12px;line-height:1.8;padding:12px;border-radius:var(--radius-sm);background:var(--hover);text-align:center}
.password-field{position:relative}
.password-field input{padding-right:52px}
.password-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--text2);font-size:20px;padding:5px;cursor:pointer}

.app{max-width:1100px;margin:auto;min-height:100vh;padding:16px 16px 100px}

.top{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;position:relative}
.top h1{margin:0;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:8px;-webkit-text-fill-color:initial}
.top h1 span{background:linear-gradient(135deg,var(--accent1),#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:1px}
.top .lock-btn{position:absolute;right:0;top:0}

.nav{
    position:fixed;
    z-index:100;
    left:50%;
    bottom:14px;
    transform:translate3d(-50%, 0, 0);
    width:min(840px,calc(100% - 20px));
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:4px;
    padding:8px 6px;
    background: rgba(16, 14, 30, 0.95);
    border: 1px solid rgba(124, 92, 252, 0.35);
    border-radius:24px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
}
.nav button{border:0;background:transparent;color:var(--text2);padding:8px 2px;border-radius:var(--radius-sm);font-size:10px;font-weight:500;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.nav button.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;box-shadow:0 4px 15px var(--shadow)}
.nav button.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:18px;height:3px;background:#ffd700;border-radius:4px}
.nav button:active{transform:scale(0.92)}

i[data-ic] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 18px !important;
    height: 18px !important;
    flex: none !important;
    vertical-align: middle !important;
    margin-right: 6px !important;
    color: var(--accent1) !important;
}
i[data-ic] svg {
    width: 18px !important;
    height: 18px !important;
    display: block !important;
}
.nav button i[data-ic] {
    width: 20px !important;
    height: 20px !important;
    margin-right: 0 !important;
    margin-bottom: 2px !important;
    color: var(--text2) !important;
}
.nav button.active i[data-ic] {
    color: #ffd700 !important;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8)) !important;
}
.nav button i[data-ic] svg {
    width: 20px !important;
    height: 20px !important;
}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card-icon{font-size:32px;margin-bottom:10px}
.card-title{font-weight:700;font-size:16px}
.card-count{color:var(--text2);font-size:13px;margin-top:4px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.section-head h2{margin:0;font-size:24px;font-weight:700}
.list{display:grid;gap:12px}
.item-main{flex:1;min-width:0}
.item-title{font-weight:700;font-size:16px}
.item-login{color:var(--text2);font-size:13px;margin-top:2px}
.item-pass{color:var(--text2);font-size:14px;margin-top:3px;word-break:break-all;font-family:monospace}
.item-date{color:var(--text2);font-size:11px;margin-top:3px;opacity:0.7}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.item-actions button{padding:6px 10px;font-size:12px;margin:0;width:auto;min-width:36px;border-radius:var(--radius-sm)}
.empty{padding:50px 20px;text-align:center;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:12px}
.search-row{display:flex;gap:10px;margin-top:14px}
.search-row input{flex:1;margin:0}
.search-row button{width:auto;padding:12px 16px;margin:0}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media-card .thumb{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.media-card .thumb img,.media-card .thumb video{width:100%;height:100%;object-fit:cover}
.media-card .video-badge{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:var(--radius-sm);background:rgba(0,0,0,0.7);font-size:11px;font-weight:600}
.media-card .media-info{padding:10px 12px}
.media-card .filename{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:600}
.media-card .filesize{color:var(--text2);font-size:11px;margin-top:3px}
.upload-zone{padding:32px 20px;text-align:center;border:2px dashed var(--border);border-radius:var(--radius);background:var(--bg3);margin-bottom:16px;cursor:pointer}
.upload-zone.drag{border-color:var(--accent1);background:var(--hover);transform:scale(1.01)}
.upload-zone .icon{font-size:42px;margin-bottom:8px}
.link-item .url{color:var(--accent1);font-size:13px;word-break:break-all;margin-top:3px;text-decoration:underline;cursor:pointer}
.link-item .url:hover{color:var(--accent2)}
.backup-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.backup-buttons button{flex:1;min-width:120px}
.error{color:#ff6b6b;text-align:center;font-size:14px;margin-top:12px;display:none;padding:8px;border-radius:var(--radius-sm);background:rgba(255,80,80,0.1)}
.success{color:#2ecc71;text-align:center;font-size:14px;margin-top:12px;display:none;padding:8px;border-radius:var(--radius-sm);background:rgba(46,204,113,0.1)}
.settings-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.settings-group button{width:auto;padding:8px 16px;font-size:12px;margin:0}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.online{background:#2ecc71;box-shadow:0 0 8px rgba(46,204,113,0.4)}
.status-dot.offline{background:#ff6b6b}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.status-online{background:rgba(46,204,113,0.2);color:#2ecc71}
.status-offline{background:rgba(255,80,80,0.2);color:#ff6b6b}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
.pagination button{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:13px;min-width:38px;font-weight:500}
.pagination button.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:var(--accent1);color:#fff}

.file-input-wrapper{position:relative;display:inline-block;width:100%}
.file-input-wrapper input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:10}
.file-input-wrapper .file-label{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border:2px dashed var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;width:100%}
.hidden{display:none !important}

@media(max-width:500px){.item{flex-wrap:wrap}.item-actions{width:100%;justify-content:flex-end;margin-top:6px}.media-grid{grid-template-columns:repeat(2,1fr)}.setting{flex-direction:column;align-items:flex-start;gap:8px}.nav{grid-template-columns:repeat(4,1fr);gap:2px;padding:6px 4px;border-radius:18px}.nav button{font-size:9px;padding:6px 2px}.lock-box{padding:24px}}
</style>
</head>

<div id="root"></div>

async function hashPasswordWithSalt(password, salt){const encoder=new TextEncoder();const data=encoder.encode(salt+password+salt);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function generateSalt(length=32){const array=new Uint8Array(length);crypto.getRandomValues(array);return Array.from(array,byte=>byte.toString(16).padStart(2,'0')).join('')}
async function deriveKey(masterPassword, salt, iterations=310000){const encoder=new TextEncoder();const keyMaterial=await crypto.subtle.importKey('raw',encoder.encode(masterPassword),'PBKDF2',false,['deriveKey']);return await crypto.subtle.deriveKey({name:'PBKDF2',salt:encoder.encode(salt),iterations:iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,key){const encoder=new TextEncoder();const iv=crypto.getRandomValues(new Uint8Array(12));const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,encoder.encode(JSON.stringify(data)));return{iv:Array.from(iv),data:Array.from(new Uint8Array(encrypted))}}
async function decryptData(encryptedData,key){const iv=new Uint8Array(encryptedData.iv);const data=new Uint8Array(encryptedData.data);const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);return JSON.parse(new TextDecoder().decode(decrypted))}

class IndexedDBStorage{
    constructor(){this.db=null;this.dbName='ShieldDB';this.storeName='userData';this.version=2;this.mode='idb';this.fallbackKey='shield_secure_store_v2'}
    open(){return new Promise((resolve)=>{
        try{
            if(!window.indexedDB) throw new Error('IndexedDB недоступен');
            const req=window.indexedDB.open(this.dbName,this.version);
            req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(this.storeName))db.createObjectStore(this.storeName,{keyPath:'id'})};
            req.onsuccess=e=>{this.db=e.target.result;this.mode='idb';resolve()};
            req.onerror=()=>{this.mode='fallback';this.db=null;resolve()};
            req.onblocked=()=>{this.mode='fallback';this.db=null;resolve()};
        }catch(e){this.mode='fallback';this.db=null;resolve()}
    })}
    fallbackRead(){try{const raw=localStorage.getItem(this.fallbackKey);return raw?JSON.parse(raw):{}}catch(e){throw new Error('Браузер не разрешает локальное хранилище.')}}
    fallbackWrite(data){try{localStorage.setItem(this.fallbackKey,JSON.stringify(data));return true}catch(e){throw new Error('Браузер не разрешает сохранение.')}}
    get(key){return new Promise((r,j)=>{if(this.mode==='fallback'){try{const all=this.fallbackRead();r(all[key]??null)}catch(e){j(e)}return}if(!this.db){j(new Error('База не открыта'));return}const tx=this.db.transaction(this.storeName,'readonly');const st=tx.objectStore(this.storeName);const req=st.get(key);req.onsuccess=()=>{r(req.result?req.result.data:null)};req.onerror=()=>{j(req.error)}})}
    set(key,data){return new Promise((r,j)=>{if(this.mode==='fallback'){try{const all=this.fallbackRead();all[key]=data;this.fallbackWrite(all);r()}catch(e){j(e)}return}if(!this.db){j(new Error('База не открыта'));return}const tx=this.db.transaction(this.storeName,'readwrite');const st=tx.objectStore(this.storeName);const req=st.put({id:key,data:data});req.onsuccess=()=>{r()};req.onerror=()=>{j(req.error)}})}
    delete(key){return new Promise((r,j)=>{if(this.mode==='fallback'){try{const all=this.fallbackRead();delete all[key];this.fallbackWrite(all);r()}catch(e){j(e)}return}if(!this.db){j(new Error('База не открыта'));return}const tx=this.db.transaction(this.storeName,'readwrite');const st=tx.objectStore(this.storeName);const req=st.delete(key);req.onsuccess=()=>{r()};req.onerror=()=>{j(req.error)}})}
    clear(){return new Promise((r,j)=>{if(this.mode==='fallback'){try{this.fallbackWrite({});r()}catch(e){j(e)}return}if(!this.db){j(new Error('База не открыта'));return}const tx=this.db.transaction(this.storeName,'readwrite');const st=tx.objectStore(this.storeName);const req=st.clear();req.onsuccess=()=>{r()};req.onerror=()=>{j(req.error)}})}
}

async function readLegacyVaultDB(){
    try{
        if(!window.indexedDB) return null;
        if(indexedDB.databases){
            const dbs=await indexedDB.databases();
            if(!dbs.some(x=>x.name==='VaultDB')) return null;
        }
        return await new Promise((resolve)=>{
            let settled=false;
            const finish=v=>{if(!settled){settled=true;resolve(v)}};
            const req=indexedDB.open('VaultDB');
            req.onerror=()=>finish(null);
            req.onupgradeneeded=()=>{ try{req.transaction.abort()}catch(_){} finish(null) };
            req.onsuccess=e=>{
                const legacy=e.target.result;
                if(!legacy.objectStoreNames.contains('userData')){legacy.close();finish(null);return}
                try{
                    const tx=legacy.transaction('userData','readonly');
                    const getReq=tx.objectStore('userData').get('users');
                    getReq.onsuccess=()=>{const value=getReq.result?.data||null;legacy.close();finish(value&&typeof value==='object'?value:null)};
                    getReq.onerror=()=>{legacy.close();finish(null)};
                }catch(_){legacy.close();finish(null)}
            };
        });
    }catch(_){return null}
}

async function migrateLegacyDataIfNeeded(){
    try{
        const current=await db.get('users');
        if(current && Object.keys(current).length) return current;
        const legacy=await readLegacyVaultDB();
        if(!legacy || !Object.keys(legacy).length) return current||{};
        await db.set('users',legacy);
        return legacy;
    }catch(e){console.warn('Legacy migration skipped:',e);return null}
}

        if (!data.ok) {
            throw new Error(data.description || 'Ошибка получения сообщений от Telegram');
        }
        
        const updates = data.result || [];
        if (updates.length === 0) {
            showToast('⚠️ Сообщений от бота не найдено. Напишите боту /start или любое слово в Telegram.', 'warning');
            updateTelegramStatus();
            return;
        }
        
        let lastChatId = null;
        let lastUsername = '';
        
        for (let i = updates.length - 1; i >= 0; i--) {
            const msg = updates[i].message || updates[i].channel_post;
            if (msg && msg.chat && msg.chat.id) {
                lastChatId = String(msg.chat.id);
                lastUsername = msg.from?.username || msg.from?.first_name || 'Пользователь';
                break;
            }
        }
        
        if (lastChatId) {
            localStorage.setItem(`telegram_chat_id_${currentUser}`, lastChatId);
            localStorage.setItem('telegram_chat_id', lastChatId);
            showToast(`✅ Подключено! Chat ID: ${lastChatId} (${lastUsername})`, 'success');
            updateTelegramStatus();
        } else {
            showToast('⚠️ Напишите боту любое сообщение и повторите проверку', 'warning');
            updateTelegramStatus();
        }
    } catch (e) {
        console.error('checkTelegramConnection error:', e);
        showToast('❌ Ошибка проверки: ' + e.message, 'error');
        updateTelegramStatus();
    }
}

async function sendBackupToTelegram() {
    const chatId = getTelegramChatId();
    if (!chatId) {
        showToast('❌ Сначала нажмите "Подключить Telegram" и отправьте боту сообщение', 'error');
        return;
    }
    if (!currentUser || !encryptionKey) {
        showToast('❌ Войдите в аккаунт', 'error');
        return;
    }
    
    try {
        showToast('🔐 Шифрование и отправка бэкапа...', 'warning');
        
        const backupPayload = {
            format: 'Shield Encrypted Backup',
            version: 3,
            user: currentUser,
            exportDate: new Date().toISOString(),
            data: normalizeUserData(userData)
        };
        
        const encrypted = await encryptData(backupPayload, encryptionKey);
        const jsonString = JSON.stringify(encrypted);
        const blob = new Blob([jsonString], { type: 'application/json' });
        
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('caption', `🛡️ Бэкап Shield\n👤 ${currentUser}\n📅 ${new Date().toLocaleString()}\n📦 ${(jsonString.length / 1024).toFixed(1)} КБ`);
        formData.append('document', blob, `shield_backup_${currentUser}_${new Date().toISOString().slice(0, 10)}.json`);
        
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument`, {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        if (result.ok) {
            const fileId = result.result?.document?.file_id;
            if (fileId) {
                sessionStorage.setItem(`tg_file_id_${currentUser}`, fileId);
                localStorage.setItem(`tg_last_file_id_${currentUser}`, fileId);
            }
            showToast('✅ Бэкап успешно отправлен в Telegram!', 'success');
        } else {
            showToast('❌ Ошибка Telegram: ' + (result.description || 'Не удалось отправить'), 'error');
        }
    } catch (e) {
        console.error('sendBackupToTelegram error:', e);
        showToast('❌ Ошибка: ' + e.message, 'error');
    }
}

async function restoreFromTelegram() {
    const chatId = getTelegramChatId();
    if (!chatId) {
        showToast('❌ Сначала нажмите "Подключить Telegram"', 'error');
        return;
    }
    if (!currentUser || !encryptionKey) {
        showToast('❌ Войдите в аккаунт', 'error');
        return;
    }
    
    if (!confirm('Загрузить последний бэкап из Telegram? Текущие данные будут заменены!')) {
        return;
    }
    
    try {
        showToast('🔍 Поиск бэкапа в Telegram...', 'warning');
        
        let fileId = sessionStorage.getItem(`tg_file_id_${currentUser}`) || localStorage.getItem(`tg_last_file_id_${currentUser}`);
        
        if (!fileId) {
            const updatesRes = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=-50`);
            const updatesData = await updatesRes.json();
            if (updatesData.ok && Array.isArray(updatesData.result)) {
                for (let i = updatesData.result.length - 1; i >= 0; i--) {
                    const msg = updatesData.result[i].message || updatesData.result[i].channel_post;
                    if (msg && String(msg.chat?.id) === String(chatId) && msg.document) {
                        if (msg.document.file_name && msg.document.file_name.includes(currentUser)) {
                            fileId = msg.document.file_id;
                            break;
                        }
                    }
                }
            }
        }
        
        if (!fileId) {
            const manualFileId = prompt('Не удалось найти file_id автоматически. Введите file_id документа из Telegram:');
            if (manualFileId && manualFileId.trim()) {
                fileId = manualFileId.trim();
            } else {
                showToast('❌ file_id не найден', 'error');
                return;
            }
        }
        
        showToast('📥 Загрузка файла из Telegram...', 'warning');
        const fileInfoRes = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getFile?file_id=${fileId}`);
        const fileInfo = await fileInfoRes.json();
        
        if (!fileInfo.ok || !fileInfo.result?.file_path) {
            throw new Error(fileInfo.description || 'Файл не найден в Telegram');
        }
        
        const filePath = fileInfo.result.file_path;
        const downloadRes = await fetch(`https://api.telegram.org/file/bot${TELEGRAM_TOKEN}/${filePath}`);
        if (!downloadRes.ok) throw new Error('Ошибка чтения файла бэкапа');
        
        const encryptedData = await downloadRes.json();
        const payload = await decryptData(encryptedData, encryptionKey);
        
        if (!payload || !payload.data) {
            throw new Error('Данные бэкапа повреждены или неверный пароль');
        }
        
        userData = normalizeUserData(payload.data);
        await DB.saveUserData(currentUser, userData, encryptionKey);
        renderAll();
        
        const count = (userData.passwords || []).length + 
                     (userData.media || []).length + 
                     (userData.links || []).length + 
                     (userData.files || []).length;
        showToast(`✅ Данные восстановлены из Telegram! (${count} активных записей)`, 'success');
        
    } catch (e) {
        console.error('restoreFromTelegram error:', e);
        showToast('❌ Ошибка восстановления: ' + e.message, 'error');
    }
}

// РАБОТА С АРХИВОМ: ПЕРЕМЕЩЕНИЕ, ВОССТАНОВЛЕНИЕ, ОЧИСТКА
async function moveToArchive(type, id) {
    userData = normalizeUserData(userData);
    if (!userData[type] || !Array.isArray(userData[type])) return false;
    const item = userData[type].find(x => String(x.id) === String(id));
    if (!item) return false;

    const archivedItem = {
        ...item,
        deletedAt: Date.now(),
        updatedAt: Date.now()
    };

    const alreadyInArchive = userData.archive[type].some(x => String(x.id) === String(id));
    if (!alreadyInArchive) {
        userData.archive[type].push(archivedItem);
    }

    userData[type] = userData[type].filter(x => String(x.id) !== String(id));

    if (currentUser && encryptionKey) {
        await DB.saveUserData(currentUser, userData, encryptionKey);
    }
    return true;
}

async function restoreFromArchive(type, id) {
    userData = normalizeUserData(userData);
    const archiveItems = userData.archive[type] || [];
    const item = archiveItems.find(x => String(x.id) === String(id));
    if (!item) return;

    const restoredItem = { ...item };
    delete restoredItem.deletedAt;
    restoredItem.updatedAt = Date.now();

    if (!userData[type]) userData[type] = [];
    userData[type].push(restoredItem);
    userData.archive[type] = archiveItems.filter(x => String(x.id) !== String(id));

    await DB.saveUserData(currentUser, userData, encryptionKey);
    renderArchive();
    showToast('✅ Запись восстановлена', 'success');
    resetAutoLockTimer();
}

async function deleteFromArchive(type, id) {
    if (!confirm('Удалить из архива навсегда?')) return;
    userData.archive = normalizeArchive(userData.archive);
    userData.archive[type] = userData.archive[type].filter(x => String(x.id) !== String(id));

    await DB.saveUserData(currentUser, userData, encryptionKey);
    renderArchive();
    showToast('🗑 Удалено из архива', 'warning');
    resetAutoLockTimer();
}

async function clearArchive() {
    if (!confirm('Удалить весь архив навсегда? Данные нельзя будет восстановить!')) return;
    userData.archive = { media: [], files: [], passwords: [], links: [] };

    await DB.saveUserData(currentUser, userData, encryptionKey);

    showToast('🗑 Архив очищен', 'warning');

}

/* ===== СКРЫТИЕ ФОНА И ДАННЫХ ПРИ БЛОКИРОВКЕ ===== */
function triggerLockModal() {
    if (!unlocked && !_tempCurrentUser) return;
    if (unlocked) {
        _tempCurrentUser = currentUser;
        _tempUserData = userData;
        _tempEncryptionKey = encryptionKey;
    }
    unlocked = false;
    if (autoLockTimer) {
        clearInterval(autoLockTimer);
        autoLockTimer = null;
    }

    const rootEl = document.getElementById('root');
    if (rootEl) {
        rootEl.style.display = 'none';
    }

    showUnlockModal();
}

async function showUnlockModal() {
    const old = document.getElementById('unlockModal');
    if (old) old.remove();

    const targetUser = _tempCurrentUser || currentUser;
    if (!targetUser) {
        logout();
        return;
    }

    const modal = document.createElement('div');
    modal.id = 'unlockModal';
    modal.className = 'modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;';

    modal.innerHTML = `
        <div class="modal-box" style="text-align:center;max-width:380px;border-color:var(--accent1);box-shadow:0 0 30px rgba(124,92,252,0.4);">
            <div style="margin-bottom:12px;">${getGoldShieldSVG(64)}</div>
            <h2 style="font-size:22px;margin-bottom:6px;background:linear-gradient(135deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
                ${currentLang === 'en' ? 'App Locked' : 'Приложение заблокировано'}
            </h2>
            <p style="color:var(--text2);font-size:13px;margin-bottom:16px;">
                ${currentLang === 'en' ? 'Enter master password for ' : 'Введите пароль для '}<strong>${esc(targetUser)}</strong>
            </p>
            <div class="field" style="margin-bottom:16px;">
                <div class="password-field">
                    <input id="unlockPasswordInput" type="password" placeholder="${currentLang === 'en' ? 'Password' : 'Пароль'}" autofocus maxlength="100">
                    <button class="password-toggle" onclick="togglePasswordVisibility('unlockPasswordInput')">👁️</button>
                </div>
            </div>
            <div id="unlockError" class="error" style="margin-bottom:12px;"></div>
            <button id="unlockConfirmBtn" class="primary" style="margin-top:0;">
                🔓 ${currentLang === 'en' ? 'Unlock' : 'Разблокировать'}
            </button>
            <button id="unlockExitBtn" class="secondary" style="width:100%;margin-top:10px;">
                🚪 ${currentLang === 'en' ? 'Exit Account' : 'Выйти из аккаунта'}
            </button>
        </div>
    `;

    document.body.appendChild(modal);

    const input = document.getElementById('unlockPasswordInput');
    const confirmBtn = document.getElementById('unlockConfirmBtn');
    const exitBtn = document.getElementById('unlockExitBtn');
    const errorEl = document.getElementById('unlockError');

    async function doUnlock() {
        const pass = input.value;
        if (!pass) {
            errorEl.textContent = currentLang === 'en' ? '❌ Enter password' : '❌ Введите пароль';
            errorEl.style.display = 'block';
            return;
        }

        confirmBtn.disabled = true;
        confirmBtn.textContent = '⏳ ...';

        try {
            const users = await DB.getUsers();
            const user = users[targetUser];
            if (!user) throw new Error('Пользователь не найден');

            const hashedInput = await hashPasswordWithSalt(pass, user.salt);
            if (user.password !== hashedInput) {
                errorEl.textContent = currentLang === 'en' ? '❌ Invalid password' : '❌ Неверный пароль';
                errorEl.style.display = 'block';
                confirmBtn.disabled = false;
                confirmBtn.textContent = currentLang === 'en' ? '🔓 Unlock' : '🔓 Разблокировать';
                return;
            }

            currentUser = _tempCurrentUser || currentUser;
            userData = _tempUserData || userData;
            encryptionKey = _tempEncryptionKey || encryptionKey;

            _tempCurrentUser = null;
            _tempUserData = null;
            _tempEncryptionKey = null;

            unlocked = true;
            modal.remove();

            const rootEl = document.getElementById('root');
            if (rootEl) {
                rootEl.style.display = 'block';
            }

            showToast(currentLang === 'en' ? '🔓 Unlocked!' : '🔓 Приложение разблокировано!', 'success');
            resetAutoLockTimer();
        } catch (e) {
            errorEl.textContent = '❌ ' + e.message;
            errorEl.style.display = 'block';
            confirmBtn.disabled = false;
            confirmBtn.textContent = currentLang === 'en' ? '🔓 Unlock' : '🔓 Разблокировать';
        }
    }

    confirmBtn.onclick = doUnlock;
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doUnlock();
    });

    exitBtn.onclick = () => {
        _tempCurrentUser = null;
        _tempUserData = null;
        _tempEncryptionKey = null;
        modal.remove();
        const rootEl = document.getElementById('root');
        if (rootEl) rootEl.style.display = 'block';
        logout();
    };
}

window.handleTabVisibility = function() {
    if (document.visibilityState === 'hidden' && unlocked) {
        if (currentUser && userData && encryptionKey) {
            DB.saveUserData(currentUser, userData, encryptionKey).catch(() => {});
        }
        triggerLockModal();
        showToast(currentLang === 'en' ? '🔒 Locked on tab switch' : '🔒 Заблокировано при смене вкладки', 'warning');
    }
};

window.setupTabLock = function() {
    document.removeEventListener('visibilitychange', handleTabVisibility);
    if (lockOnTabSwitch) {
        document.addEventListener('visibilitychange', handleTabVisibility);
    }
};

window.setTabLock = function(enabled) {
    lockOnTabSwitch = enabled;
    localStorage.setItem('shield_tablock', enabled ? '1' : '0');
    showToast(enabled ? '🔒 Блокировка включена' : '🔓 Блокировка отключена', 'warning');
    setupTabLock();
    renderSettings();
};

function resetAutoLockTimer(){
    lastActivityTime = Date.now();
    if (autoLockTimer) {
        clearInterval(autoLockTimer);
        autoLockTimer = null;
    }
    if (autoLockMinutes > 0 && unlocked) {
        autoLockTimer = setInterval(() => {
            const elapsed = (Date.now() - lastActivityTime) / 1000 / 60;
            if (elapsed >= autoLockMinutes) {
                if (unlocked) {
                    showToast(currentLang === 'en' ? `⏱ Auto-lock (${autoLockMinutes}m)` : `⏱ Автоблокировка (${autoLockMinutes} мин)`, 'warning');
                    triggerLockModal();
                }
            }
        }, 10000);
    }
}

function setupActivityListeners(){['mousedown','keydown','touchstart','scroll','click'].forEach(e=>{document.addEventListener(e,resetAutoLockTimer,{passive:true})})}

async function logout(){
    if(currentUser&&userData&&encryptionKey){await DB.saveUserData(currentUser,userData,encryptionKey)}
    if(autoLockTimer){clearInterval(autoLockTimer);autoLockTimer=null}
    _tempCurrentUser = null;
    _tempUserData = null;
    _tempEncryptionKey = null;
    unlocked=false;
    currentUser=null;
    userData=normalizeUserData(EMPTY_USER_DATA);
    encryptionKey=null;
    const rootEl = document.getElementById('root');
    if (rootEl) rootEl.style.display = 'block';
    renderLock();
    showToast('👋 Вы вышли','warning')
}

async function recoverPassword(){
    const users=await DB.getUsers();
    const username=prompt('Введите имя пользователя:');
    if(!username){return}
    if(!users[username]){showToast('❌ Пользователь не найден','error');return}
    if(!users[username].secretWord){showToast('❌ У этого пользователя не установлено секретное слово','error');return}
    const word=prompt('Введите секретное слово:');
    if(!word){return}
    const verified=await DB.verifySecretWord(username,word);
    if(!verified){showToast('❌ Неверное секретное слово!','error');return}
    const newPass=prompt('Введите новый пароль (минимум 8 символов):');
    if(!newPass||newPass.length<8){showToast('❌ Минимум 8 символов','error');return}
    const newPass2=prompt('Повторите новый пароль:');
    if(newPass!==newPass2){showToast('❌ Пароли не совпадают','error');return}
    try{
        const result=await DB.resetPassword(username,newPass);

}

async function switchToAccount(username) {
    if (!confirm(`Переключиться на аккаунт "${username}"?`)) return;
    const password = prompt(`Введите пароль для "${username}":`);
    if (!password) return;
    try {
        const result = await DB.login(username, password);
        if (result.success) {
            document.querySelector('.modal')?.remove();
            currentUser = username;
            userData = result.data;
            encryptionKey = result.key;
            unlocked = true;
            showToast(`✅ Переключено на "${username}"`, 'success');
            renderApp();
            resetAutoLockTimer();
        } else {
            showToast('❌ ' + result.error, 'error');
        }
    } catch (e) {
        showToast('❌ Ошибка: ' + e.message, 'error');
    }
}

async function deleteAccount(username) {
    if (username === currentUser) {
        if (!confirm(`Ты сейчас в аккаунте "${username}". Удалить его и выйти?`)) return;
    } else {
        if (!confirm(`Удалить аккаунт "${username}"? Данные будут потеряны безвозвратно!`)) return;
    }
    const users = await DB.getUsers();
    if (!users[username]) {
        showToast('❌ Аккаунт не найден', 'error');
        return;
    }
    delete users[username];
    await DB.saveUsers(users);
    document.querySelector('.modal')?.remove();
    if (username === currentUser) {
        await logout();
        showToast('🗑 Аккаунт удалён', 'warning');
    } else {
        showToast(`🗑 Аккаунт "${username}" удалён`, 'warning');
        showAccounts();
    }
}

async function changePassword(){if(!currentUser||!encryptionKey){showToast('❌ Войдите в аккаунт','error');return}const oldPass=prompt('Введите текущий пароль:');if(!oldPass)return;const users=await DB.getUsers();const meta=users[currentUser];if(!meta){showToast('❌ Данные не найдены','error');return}const hashedOld=await hashPasswordWithSalt(oldPass,meta.salt);if(meta.password!==hashedOld){showToast('❌ Неверный пароль','error');return}const newPass=prompt('Введите новый пароль (минимум 8):');if(!newPass||newPass.length<8){showToast('❌ Минимум 8 символов','error');return}const newPass2=prompt('Повторите новый пароль:');if(newPass!==newPass2){showToast('❌ Пароли не совпадают','error');return}try{const newSalt=generateSalt();const newDataSalt=generateSalt();const newIterations=310000;const newKey=await deriveKey(newPass,newDataSalt,newIterations);const encryptedData=await encryptData(normalizeUserData(userData),newKey);const updated={...meta,password:await hashPasswordWithSalt(newPass,newSalt),salt:newSalt,dataSalt:newDataSalt,kdfIterations:newIterations,encryptedData};delete updated.passwords;delete updated.media;delete updated.links;delete updated.files;delete updated.profile;delete updated.archive;const updatedUsers={...users,[currentUser]:updated};await DB.saveUsers(updatedUsers);encryptionKey=newKey;showToast('✅ Пароль изменён!','success');resetAutoLockTimer();renderSettings()}catch(e){showToast('❌ Ошибка смены пароля: '+e.message,'error')}}

function setAutoLock(minutes){
    autoLockMinutes = minutes;
    localStorage.setItem('autoLockMinutes', String(minutes));
    if (minutes === 0) {
        if (autoLockTimer) {
            clearInterval(autoLockTimer);
            autoLockTimer = null;
        }
        showToast(currentLang === 'en' ? '⏱ Auto-lock disabled' : '⏱ Автоблокировка отключена', 'warning');
    } else {
        resetAutoLockTimer();
        showToast(currentLang === 'en' ? `⏱ Auto-lock set to ${minutes}m` : `⏱ Автоблокировка через ${minutes} мин`, 'warning');
    }
    renderSettings();
}

function cryptoIndex(max){const a=new Uint32Array(1);const limit=Math.floor(0x100000000/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}
function generatePassword(){const length=Math.max(8,Math.min(32,parseInt(document.getElementById('passLength')?.value||16,10)));const upper='ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower='abcdefghijklmnopqrstuvwxyz',digits='0123456789',symbols='!@#$%^&*()_+-=';const groups=[upper,lower,digits,symbols];const all=upper+lower+digits+symbols;let chars=groups.map(g=>g[cryptoIndex(g.length)]);while(chars.length<length)chars.push(all[cryptoIndex(all.length)]);for(let i=chars.length-1;i>0;i--){const j=cryptoIndex(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}const pass=chars.join('');const el=document.getElementById('generatedPass');if(el){el.value=pass;el.style.borderColor='#2ecc71'}showToast('✅ Пароль сгенерирован!','success');navigator.clipboard?.writeText(pass).then(()=>{showToast('📋 Пароль скопирован!','success')}).catch(()=>{});resetAutoLockTimer()}

async function exportData(){if(!currentUser||!encryptionKey){showToast('❌ Войдите в аккаунт','error');return}try{const payload={format:'Shield Backup',version:'3.0',exportDate:new Date().toISOString(),user:currentUser,data:normalizeUserData(userData)};const encrypted=await encryptData(payload,encryptionKey);const backup={format:'Shield Encrypted Backup',version:3,algorithm:'AES-GCM-256',kdf:'PBKDF2',encrypted:encrypted};const blob=new Blob([JSON.stringify(backup)],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='shield_backup_'+currentUser+'_'+new Date().toISOString().slice(0,10)+'.vault';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},100);const count=(userData.passwords||[]).length+(userData.media||[]).length+(userData.links||[]).length+(userData.files||[]).length;showToast('✅ Зашифрованный бэкап создан: '+count+' записей','success');resetAutoLockTimer()}catch(e){showToast('❌ Ошибка экспорта: '+e.message,'error')}}
function importData(){if(!currentUser||!encryptionKey){showToast('❌ Войдите в аккаунт','error');return}const input=document.createElement('input');input.type='file';input.accept='.vault,application/octet-stream,application/json';input.style.display='none';document.body.appendChild(input);input.onchange=async function(e){const file=e.target.files[0];if(!file){input.remove();return}try{const text=await file.text();const backup=JSON.parse(text);if(backup.format!=='Shield Encrypted Backup'||!backup.encrypted){throw new Error('Неверный или неподдерживаемый бэкап')}const payload=await decryptData(backup.encrypted,encryptionKey);if(payload.user!==currentUser||!payload.data)throw new Error('Бэкап другого пользователя или повреждён');const d=normalizeUserData(payload.data);const count=(d.passwords||[]).length+(d.media||[]).length+(d.links||[]).length+(d.files||[]).length;if(!confirm('Восстановить '+count+' записей? Текущие данные будут заменены.')){input.remove();return}userData=d;await DB.saveUserData(currentUser,userData,encryptionKey);showToast('✅ Восстановлено '+count+' записей','success');renderAll();resetAutoLockTimer()}catch(e){showToast('❌ Импорт не выполнен: '+e.message,'error')}finally{input.remove()}};input.click();resetAutoLockTimer()}

function switchTab(newSection){
    if(newSection===section)return;
    section=newSection;
    document.querySelectorAll('.nav button').forEach(b=>{
        b.classList.toggle('active', b.dataset.section === section);
    });
    renderSection();
    resetAutoLockTimer();
}

}
function showSuccess(text){
    const ok=document.getElementById('authSuccess');

function initGlobalParticles() {
    const container = document.getElementById('globalParticles');
    if (!container || container.children.length > 0) return;
    for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 3 + Math.random() * 4;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        container.appendChild(p);
    }
}

function renderSection(){
    const content=document.getElementById('content');
    if(!content)return;
    try{
        content.style.display='block';
        content.style.visibility='visible';
        content.style.minHeight='220px';
        if(section==='home')renderHome();
        else if(section==='passwords'){currentPage=1;renderPasswords()}
        else if(section==='links'){currentPage=1;renderLinks()}
        else if(section==='media')renderMedia();
        else if(section==='files')renderFiles();
        else if(section==='archive')renderArchive();
        else if(section==='profile')renderProfile();

function getPaginatedItems(items,page){const start=(page-1)*itemsPerPage;const end=start+itemsPerPage;return items.slice(start,end)}
function renderPagination(totalItems,page,renderFn){const totalPages=Math.ceil(totalItems/itemsPerPage);if(totalPages<=1)return '';let html='<div class="pagination">';html+='<button onclick="goToPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>‹</button>';for(let i=1;i<=totalPages;i++){if(i===1||i===totalPages||Math.abs(i-page)<=2){html+='<button onclick="goToPage('+i+')" class="'+(i===page?'active':'')+'">'+i+'</button>'}else if(i===page-3||i===page+3){html+='<span style="color:var(--text2)">…</span>'}}html+='<button onclick="goToPage('+(page+1)+')" '+(page>=totalPages?'disabled':'')+'>›</button>';html+='</div>';return html}
function goToPage(page){currentPage=page;const totalItems=(section==='passwords')?(userData.passwords||[]).length:(section==='links')?(userData.links||[]).length:(section==='files')?(userData.files||[]).length:0;const totalPages=Math.ceil(totalItems/itemsPerPage);if(page<1||page>totalPages)return;if(section==='passwords')renderPasswords();else if(section==='links')renderLinks();else if(section==='files')renderFiles();resetAutoLockTimer()}

function renderMediaGrid(items){const grid=document.getElementById('mediaGrid');if(!grid)return;if(!items||!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="icon">🖼</div><p>'+t('noMedia')+'</p></div>';return}grid.innerHTML=items.map(item=>'<div class="media-card" data-id="'+item.id+'"><div class="thumb">'+(item.type==='image'?'<img src="'+item.data+'" alt="" loading="lazy">':'<video src="'+item.data+'" muted preload="metadata" loading="lazy"></video><div class="video-badge">▶ Video</div>')+'</div><div class="media-info"><span class="filename">'+esc(item.name)+'</span><div class="filesize">'+item.size+'</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;"><button class="secondary" onclick="viewMedia(\''+item.id+'\')" style="padding:4px 12px;font-size:12px;">👁</button><button class="secondary" onclick="downloadMedia(\''+item.id+'\')" style="padding:4px 12px;font-size:12px;">⬇️</button><button class="danger-btn" onclick="deleteMedia(\''+item.id+'\')" style="padding:4px 12px;font-size:12px;">🗑</button></div></div></div>').join('')}
function setupMediaUpload(){
    const input=document.getElementById('fileInput'),zone=document.getElementById('uploadZone'),status=document.getElementById('uploadStatus'),wrapper=document.getElementById('mediaFileWrapper');
    if(!input||!zone)return;
    input.onchange=()=>handleMediaFiles(input.files);
    zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag');if(wrapper)wrapper.classList.add('drag')};
    zone.ondragleave=()=>{zone.classList.remove('drag');if(wrapper)wrapper.classList.remove('drag')};
    zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');if(wrapper)wrapper.classList.remove('drag');handleMediaFiles(e.dataTransfer.files)};
    async function handleMediaFiles(files){
        const MAX=30*1024*1024;
        const valid=[...files].filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
        if(!valid.length){showToast('❌ Выберите фото или видео','error');return}
        const oversized=valid.filter(f=>f.size>MAX);
        if(oversized.length)showToast('❌ '+oversized.length+' файлов >30 МБ. Пропускаем.','error');
        const toUpload=valid.filter(f=>f.size<=MAX);
        if(!toUpload.length){showToast('❌ Нет файлов для загрузки','error');return}
        if(!userData.media)userData.media=[];
        const now=Date.now();
        for(let i=0;i<toUpload.length;i++){
            const file=toUpload[i];
            status.textContent='Загрузка '+(i+1)+'/'+toUpload.length+': '+file.name;
            await new Promise(r=>{
                const reader=new FileReader();
                reader.onload=async (e)=>{
                    let dataUrl=e.target.result;
                    userData.media.push({
                        id:now+'_'+Math.random().toString(36).substr(2,4),
                        name:file.name,
                        data:dataUrl,
                        type:file.type.startsWith('image/')?'image':'video',
                        size:file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' МБ':(file.size/1024).toFixed(0)+' КБ',
                        originalSize:file.size,
                        updatedAt:now
                    });
                    r()
                };
                reader.readAsDataURL(file)
            })
        }
        if(encryptionKey)await DB.saveUserData(currentUser,userData,encryptionKey);
        status.textContent='✅ Готово';
        showToast('✅ Загружено '+toUpload.length+' файлов','success');
        renderMedia();
        resetAutoLockTimer()
    }
}

function downloadMedia(id){const item=(userData.media||[]).find(m=>m.id===id);if(!item){showToast('❌ Файл не найден','error');return}try{const a=document.createElement('a');a.href=item.data;a.download=item.name;document.body.appendChild(a);a.click();setTimeout(()=>document.body.removeChild(a),100);showToast('📥 Скачивание...','success');resetAutoLockTimer()}catch(e){showToast('❌ Ошибка: '+e.message,'error')}}

function viewMedia(id){
    const item=(userData.media||[]).find(m=>m.id===id);
    if(!item)return;
    const isImage=item.type==='image';
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;z-index:2000;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.95);animation:fadeIn 0.15s ease;touch-action:none;overflow:hidden;';
    modal.innerHTML='<div style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;">'+
        (isImage?'<img id="fsImage" src="'+item.data+'" style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center center;touch-action:none;user-select:none;cursor:default;display:block;" loading="lazy">':'<video id="fsVideo" src="'+item.data+'" controls autoplay playsinline style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:4px;"></video>')+
        '<button id="fsClose" style="position:absolute;top:20px;right:20px;width:44px;height:44px;border:none;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;font-size:24px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;">✕</button>'+
        '<button id="fsDownload" style="position:absolute;top:20px;right:80px;width:44px;height:44px;border:none;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;font-size:20px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;">⬇️</button>'+
        '<div style="position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.8);font-size:13px;font-weight:500;background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:20px;z-index:10;text-align:center;max-width:80%;">'+esc(item.name)+' • '+item.size+'</div></div>';
    document.body.appendChild(modal);
    if(isImage){
        const img=document.getElementById('fsImage');
        let scale=1,panX=0,panY=0,isDragging=false,startX,startY,startPanX,startPanY,lastTouchDist=0,initialPinchScale=1,touchStartTime=0;
        const MIN_SCALE=0.5,MAX_SCALE=5;
        function updateTransform(){img.style.transform='translate3d('+panX+'px, '+panY+'px, 0) scale('+scale+')';img.style.cursor=scale>1?'grab':'default'}
        function clampPan(){if(!img.complete)return;const rect=img.getBoundingClientRect();const vr=modal.getBoundingClientRect();const imgW=rect.width*scale,imgH=rect.height*scale;const viewW=vr.width,viewH=vr.height;const maxX=Math.max(0,(imgW-viewW)/2),maxY=Math.max(0,(imgH-viewH)/2);if(scale>1){panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY))}else{panX=0;panY=0}}
        function zoomAt(factor,cx,cy){scale=Math.min(MAX_SCALE,Math.max(MIN_SCALE,scale*factor));if(scale>1){const rect=img.getBoundingClientRect();const vr=modal.getBoundingClientRect();const relX=(cx-vr.left)/vr.width,relY=(cy-vr.top)/vr.height;const dx=(relX-0.5)*rect.width*(1-factor),dy=(relY-0.5)*rect.height*(1-factor);panX+=dx;panY+=dy}else{panX=0;panY=0}clampPan();updateTransform()}
        modal.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.deltaY>0?0.9:1.1,e.clientX,e.clientY)},{passive:false});
        modal.addEventListener('mousedown',function(e){if(scale<=1||e.target.closest('button'))return;isDragging=true;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;img.style.cursor='grabbing';e.preventDefault()});
        document.addEventListener('mousemove',function(e){if(!isDragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;panX=startPanX+dx;panY=startPanY+dy;clampPan();updateTransform()});
        document.addEventListener('mouseup',function(){if(isDragging){isDragging=false;img.style.cursor=scale>1?'grab':'default'}});
        modal.addEventListener('touchstart',function(e){const touches=e.touches;if(touches.length===1){if(scale>1){isDragging=true;startX=touches[0].clientX;startY=touches[0].clientY;startPanX=panX;startPanY=panY}touchStartTime=Date.now()}else if(touches.length===2){isDragging=false;lastTouchDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);initialPinchScale=scale}},{passive:true});
        modal.addEventListener('touchmove',function(e){const touches=e.touches;if(touches.length===1&&isDragging){const dx=touches[0].clientX-startX,dy=touches[0].clientY-startY;panX=startPanX+dx;panY=startPanY+dy;clampPan();updateTransform();e.preventDefault()}else if(touches.length===2){const dist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);if(lastTouchDist>0){const factor=dist/lastTouchDist;const vr=modal.getBoundingClientRect();const cx=(touches[0].clientX+touches[1].clientX)/2,cy=(touches[0].clientY+touches[1].clientY)/2;scale=Math.min(MAX_SCALE,Math.max(MIN_SCALE,initialPinchScale*factor));if(scale>1){const relX=(cx-vr.left)/vr.width,relY=(cy-vr.top)/vr.height;const imgRect=img.getBoundingClientRect();const dx=(relX-0.5)*imgRect.width*(1-factor),dy=(relY-0.5)*imgRect.height*(1-factor);panX+=dx;panY+=dy}else{panX=0;panY=0}clampPan();updateTransform();lastTouchDist=dist;initialPinchScale=scale}e.preventDefault()}},{passive:false});
        modal.addEventListener('touchend',function(e){if(e.touches.length===0){const elapsed=Date.now()-touchStartTime;if(elapsed<300&&scale===1&&e.changedTouches.length===1){scale=2.5;const vr=modal.getBoundingClientRect();const touch=e.changedTouches[0];const relX=(touch.clientX-vr.left)/vr.width,relY=(touch.clientY-vr.top)/vr.height;const imgRect=img.getBoundingClientRect();panX=(0.5-relX)*imgRect.width*0.75;panY=(0.5-relY)*imgRect.height*0.75;clampPan();updateTransform()}else if(elapsed<300&&scale>1&&e.changedTouches.length===1){scale=1;panX=0;panY=0;updateTransform()}}isDragging=false;lastTouchDist=0},{passive:true});
        updateTransform()
    }
    document.getElementById('fsClose').onclick=function(){modal.remove()};
    document.getElementById('fsDownload').onclick=function(){const a=document.createElement('a');a.href=item.data;a.download=item.name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a)},100);showToast('📥 Скачивание...','success')};
    modal.onclick=function(e){if(e.target===modal)modal.remove()};
    resetAutoLockTimer()
}

function setupFileUpload(){
    const input=document.getElementById('fileInputFiles'),zone=document.getElementById('fileUploadZone'),status=document.getElementById('fileUploadStatus'),wrapper=document.getElementById('fileFileWrapper');
    if(!input||!zone)return;
    input.onchange=()=>handleFileUpload(input.files);
    zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag');if(wrapper)wrapper.classList.add('drag')};
    zone.ondragleave=()=>{zone.classList.remove('drag');if(wrapper)wrapper.classList.remove('drag')};
    zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');if(wrapper)wrapper.classList.remove('drag');handleFileUpload(e.dataTransfer.files)};
    async function handleFileUpload(files){const MAX=30*1024*1024;
    const valid=[...files].filter(f=>f.size<=MAX);if(!valid.length){showToast('❌ Нет файлов или все >30 МБ','error');return}const oversized=[...files].filter(f=>f.size>MAX);if(oversized.length)showToast('⚠️ '+oversized.length+' файлов >30 МБ пропущены','warning');if(!userData.files)userData.files=[];const now=Date.now();for(let i=0;i<valid.length;i++){const file=valid[i];status.textContent='Загрузка '+(i+1)+'/'+valid.length+': '+file.name;await new Promise(r=>{const reader=new FileReader();reader.onload=e=>{userData.files.push({id:now+'_'+Math.random().toString(36).substr(2,6),name:file.name,data:e.target.result,size:file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' МБ':(file.size/1024).toFixed(0)+' КБ',created:new Date().toLocaleString(),updatedAt:now});r()};reader.readAsDataURL(file)})}if(encryptionKey)await DB.saveUserData(currentUser,userData,encryptionKey);status.textContent='✅ Готово';showToast('✅ Загружено '+valid.length+' файлов','success');renderFiles();resetAutoLockTimer()}
}
async function deleteFile(id){if(!confirm('Переместить файл в архив?'))return;const moved=await moveToArchive('files',id);if(moved){renderFiles();showToast('📦 Перемещено в архив','warning');resetAutoLockTimer()}}
function downloadFile(id){const item=(userData.files||[]).find(f=>f.id===id);if(!item){showToast('❌ Файл не найден','error');return}try{const a=document.createElement('a');a.href=item.data;a.download=item.name;document.body.appendChild(a);a.click();setTimeout(()=>document.body.removeChild(a),100);showToast('📥 Скачивание...','success');resetAutoLockTimer()}catch(e){showToast('❌ Ошибка: '+e.message,'error')}}

function renderArchive() {
    userData = normalizeUserData(userData);
    const archive = userData.archive;
    const allItems = [
        ...(archive.passwords || []).map(p => ({ ...p, archiveType: 'passwords', icon: '🔑', label: p.name + (p.login ? ' (' + p.login + ')' : '') })),
        ...(archive.links || []).map(l => ({ ...l, archiveType: 'links', icon: '🔗', label: l.name + (l.url ? ' (' + l.url + ')' : '') })),
        ...(archive.media || []).map(m => ({ ...m, archiveType: 'media', icon: '🖼', label: m.name })),
        ...(archive.files || []).map(f => ({ ...f, archiveType: 'files', icon: '📁', label: f.name }))

    const c = document.getElementById('content');
    if (!c) return;

    c.innerHTML = `
        <div class="section-head">
            <h2>📦 ${t('archiveHead')} <span style="font-size:14px;color:var(--text2)">(${allItems.length})</span></h2>
            ${allItems.length ? `<button onclick="clearArchive()" class="danger-btn">🗑 Очистить архив</button>` : ''}
        </div>
        <div id="archiveList" class="list" style="margin-top:14px">
            ${allItems.length ? allItems.map(item => `

                    <div class="icon">📦</div>

                </div>

    'database': '<ellipse cx="12" cy="6.4" rx="7.4" ry="2.8"/><path d="M4.6 6.4v11.2c0 1.6 3.3 2.8 7.4 2.8s7.4-1.2 7.4-2.8V6.4"/><path d="M4.6 12c0 1.6 3.3 2.8 7.4 2.8s7.4-1.2 7.4-2.8"/>',

};

function renderIcons(scope) {
    const nodes = (scope || document).querySelectorAll('i[data-ic]:not([data-rendered])');
    nodes.forEach(el => {
        const name = el.getAttribute('data-ic');
        const path = ICON_PATHS[name];
        if (path) {
            el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${path}</svg>`;
            el.setAttribute('data-rendered', 'true');
        }
    });
}

const EMOJI_TO_ICON = {
    '🔑': 'key', '🔗': 'link', '🖼': 'image', '📁': 'folder', '👤': 'user',
    '⚙': 'sliders', '⌂': 'home', '🚪': 'exit', '➕': 'plus', '🔍': 'search',
    '✕': 'x', '👁': 'eye', '📋': 'copy', '✎': 'pencil', '🗑': 'trash',
    '⬇️': 'download', '📤': 'upload', '☁️': 'cloud', '🔄': 'refresh',
    '📖': 'book', '✅': 'check', '⚠️': 'alert', '🌙': 'moon', '☀️': 'sun',
    '🎲': 'dice', '⏱': 'clock', '📅': 'calendar', '📊': 'chart', '📦': 'box',
    '📭': 'inbox', '💡': 'bulb', '🔒': 'lock', '🔐': 'shield-check',
    '💾': 'database', '🔓': 'lock', '📥': 'download', '👥': 'user',
    '⭐': 'star', '🚀': 'rocket', '🎯': 'target', '📌': 'pin'
};

let replaceScheduled = false;
function replaceEmojis() {
    if (replaceScheduled) return;
    replaceScheduled = true;
    requestAnimationFrame(() => {
        replaceScheduled = false;
        document.querySelectorAll('button:not([data-ep]), .setting-label:not([data-ep]), .card-title:not([data-ep]), .section-head h2:not([data-ep]), .item-title:not([data-ep]), .nav button:not([data-ep]), .modal-head h2:not([data-ep]), .upload-zone h3:not([data-ep]), .empty p:not([data-ep]), .file-label .text:not([data-ep]), .muted:not([data-ep]), .setting-desc:not([data-ep])')
            .forEach(el => {
                let html = el.innerHTML;
                let changed = false;
                for (const [emoji, iconName] of Object.entries(EMOJI_TO_ICON)) {
                    if (html.includes(emoji)) {
                        html = html.replaceAll(emoji, `<i data-ic="${iconName}"></i> `);
                        changed = true;
                    }
                }
                if (changed) {
                    el.innerHTML = html.trim();
                }
                el.setAttribute('data-ep', '1');
            });
        renderIcons(document);
    });
}

async function start(){
    try{
        await DB.init();
        initGlobalParticles();
        const users=await DB.getUsers();
        if(users&&Object.keys(users).length) showToast('✅ Хранилище готово','success');
        renderLock();
    }catch(e){
        document.body.innerHTML='<main class="lock"><section class="lock-box"><h2>❌ Ошибка</h2><p class="muted">'+esc(e.message)+'</p></section></main>';
    }
}
start();

replaceEmojis();
const iconObserver = new MutationObserver(() => { replaceEmojis(); });
iconObserver.observe(document.body, { childList: true, subtree: true });
</script>
